[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treegptq"
version = "0.1.0"
description = "Post-training quantization for fitted tree ensembles (XGBoost, scikit-learn). GPTQ-style error compensation, sensitivity-weighted codebooks, per-tree bit allocation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gaurav Sood" }]
keywords = ["quantization", "compression", "xgboost", "gradient-boosting", "random-forest", "gptq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
sklearn = ["scikit-learn>=1.2"]
bench = ["xgboost>=1.7", "scikit-learn>=1.2", "pandas>=2.0", "pyyaml"]
dev = ["pytest>=7", "hypothesis>=6", "ruff", "mypy", "xgboost>=1.7", "scikit-learn>=1.2", "pandas>=2.0", "pyyaml"]

[project.urls]
Homepage = "https://github.com/soodoku/treegptq"

[tool.hatch.build.targets.wheel]
packages = ["src/treegptq"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
